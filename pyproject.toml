[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice-mcp"
version = "0.1.6"
description = "MCP server for Lattice HR — manage objectives via browser session replay"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.40",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lattice = "lattice.cli:main"
lattice-mcp = "lattice.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
